<body>
    <main>

        <section>
      <h1>Informasi Stok Bahan Ajar</h1>
    
      <table>
        <thead>
          <tr>
            <th>Kode Lokasi</th>
            <th>Kode Barang</th>
            <th>Nama Barang</th>
            <th>Jenis Barang</th>
            <th>Edisi</th>
            <th>Stok</th>
          </tr>
        </thead>
        <tbody id="stok-body"></tbody>
      </table>
    </section>
    
    <section>
      <h2>Tambah Stok Baru</h2>
      <div class="add-stok-form">
        <input type="text" id="kodeLokasi" placeholder="Kode Lokasi" />
        <input type="text" id="kodeBarang" placeholder="Kode Barang" />
        <input type="text" id="namaBarang" placeholder="Nama Barang" />
        <input type="text" id="jenisBarang" placeholder="Jenis Barang" />
        <input type="text" id="edisi" placeholder="Edisi" />
        <input type="number" id="stok" placeholder="Stok" />
        <button id="tambah-btn">Tambah</button>
      </div>
    </section>
    </main>

<script type="module" src="./js/stok.js"></script>
</body>
</html>
